<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Memento Mori - Life Calendar</title>
    <!-- Tailwind for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and Babel for single-file JSX execution -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            background-color: #020617;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .color-wheel {
            background: conic-gradient(red, yellow, green, cyan, blue, magenta, red);
        }

        /* Enforce readable input sizes to prevent auto-zoom on mobile Chrome */
        input[type="date"], input[type="text"], input[type="number"] {
            font-size: 16px !important;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;

        // --- CONSTANTS ---
        const DEFAULT_LIFESPAN = 90;
        const MONTH_WEEKS = [4, 4, 4, 5, 4, 4, 5, 4, 4, 5, 4, 5]; // Sums to 52
        const STORAGE_KEY = 'memento_mori_v4_storage';
        const PRESET_COLORS = [
            '#ef4444', '#f97316', '#f59e0b', '#eab308', '#84cc16', 
            '#22c55e', '#10b981', '#06b6d4', '#0ea5e9', '#3b82f6', 
            '#6366f1', '#8b5cf6', '#a855f7', '#d946ef', '#ec4899', '#f43f5e'
        ];

        // --- HELPERS ---
        // Aligns grid to calendar months. Year 0 is birth year.
        const getCalendarDateForGridPos = (birthDate, ageYear, monthIndex, weekInMonthIndex) => {
            const calYear = birthDate.getFullYear() + ageYear;
            // Approximate date for the week block: Start of month + (weekIndex * 7) days
            const date = new Date(calYear, monthIndex, (weekInMonthIndex * 7) + 1);
            return date;
        };

        // --- COMPONENTS ---

        const LifeGrid = ({ userData }) => {
            const { dob, lifespanYears, sections } = userData;
            const birthDate = useMemo(() => new Date(dob), [dob]);
            const now = useMemo(() => new Date(), []);
            const gridWrapperRef = useRef(null);
            const [scale, setScale] = useState(1);

            const sectionDates = useMemo(() => {
                return (sections || []).map(s => ({
                    ...s,
                    start: new Date(s.startDate),
                    end: s.endDate === 'current' ? now : new Date(s.endDate)
                })).sort((a, b) => a.start.getTime() - b.start.getTime());
            }, [sections, now]);

            useEffect(() => {
                const handleResize = () => {
                    if (gridWrapperRef.current) {
                        const horizontalMargin = 32;
                        const parentWidth = window.innerWidth - horizontalMargin;
                        const gridWidth = gridWrapperRef.current.scrollWidth; 
                        if (gridWidth > parentWidth) {
                            setScale(parentWidth / gridWidth);
                        } else {
                            setScale(1);
                        }
                    }
                };
                handleResize();
                window.addEventListener('resize', handleResize);
                const timer = setTimeout(handleResize, 150);
                return () => {
                    window.removeEventListener('resize', handleResize);
                    clearTimeout(timer);
                };
            }, [userData.lifespanYears]);

            const renderDecade = (startYear) => {
                const yearRows = [];
                const endYear = Math.min(startYear + 10, lifespanYears + 1);

                for (let year = startYear; year < endYear; year++) {
                    const monthGroups = [];

                    MONTH_WEEKS.forEach((numWeeks, monthIdx) => {
                        const dots = [];
                        for (let w = 0; w < numWeeks; w++) {
                            const weekDate = getCalendarDateForGridPos(birthDate, year, monthIdx, w);
                            
                            const isLived = weekDate >= birthDate && weekDate <= now;
                            const isFuture = weekDate > now;
                            const isPreBirth = weekDate < birthDate;

                            let color = isLived ? '#FFFFFF' : 'transparent';
                            let opacity = '1';
                            let borderStyle = 'none';

                            if (isLived) {
                                const activeSection = sectionDates.find(s => weekDate >= s.start && weekDate < s.end);
                                if (activeSection) color = activeSection.color;
                            } else if (isFuture) {
                                opacity = '0.2';
                                borderStyle = '1.5px solid rgba(255,255,255,0.95)';
                            } else if (isPreBirth) {
                                opacity = '0.05';
                                color = '#FFFFFF'; // Faint indicator of the grid
                            }

                            dots.push(
                                <div key={w} className="w-1.5 h-1.5 rounded-full shrink-0"
                                     style={{ 
                                         backgroundColor: color, 
                                         opacity, 
                                         border: borderStyle 
                                     }} 
                                />
                            );
                        }
                        monthGroups.push(<div key={monthIdx} className="flex gap-[2px]">{dots}</div>);
                    });

                    yearRows.push(
                        <div key={year} className="flex items-center gap-[8px] h-[10px]">
                            {/* VERTICAL AXIS - Only Decades: 0, 10, 20... */}
                            <div className="w-8 text-[12px] text-slate-500 font-bold font-mono text-right shrink-0">
                                {year % 10 === 0 ? year : ''}
                            </div>
                            <div className="flex gap-[6px]">{monthGroups}</div>
                        </div>
                    );
                }

                return (
                    <div key={startYear} className="flex flex-col gap-[3px] mb-4 p-3 border border-slate-900 rounded-lg bg-slate-900/20">
                        {yearRows}
                    </div>
                );
            };

            const decades = [];
            for (let y = 0; y <= lifespanYears; y += 10) decades.push(renderDecade(y));

            return (
                <div className="flex flex-col items-center py-8 w-full select-none overflow-hidden">
                    <div className="mb-8 w-full max-w-sm px-6 flex flex-col items-center text-center">
                        <h3 className="text-sm font-black uppercase tracking-[0.4em] text-slate-500 mb-3">Life Chapters</h3>
                        <p className="text-xs font-mono tracking-widest uppercase text-slate-600 mb-6 opacity-70">Grid aligned to calendar months</p>
                        
                        <div className="flex flex-wrap justify-center gap-x-5 gap-y-4 w-full">
                            {(sections || []).map(s => (
                                <div key={s.id} className="flex items-center gap-2.5 text-xs">
                                    <div className="w-3 h-3 rounded-full shrink-0 shadow-md" style={{ backgroundColor: s.color }} />
                                    <span className="text-slate-400 font-semibold truncate">{s.label}</span>
                                </div>
                            ))}
                            <div className="flex items-center gap-2.5 text-xs">
                                <div className="w-3 h-3 rounded-full bg-white shadow-md" />
                                <span className="text-slate-400 font-semibold">Lived</span>
                            </div>
                            <div className="flex items-center gap-2.5 text-xs">
                                <div className="w-3 h-3 rounded-full border-2 border-white/90" />
                                <span className="text-slate-400 font-semibold">Future</span>
                            </div>
                        </div>
                    </div>
                    
                    <div 
                        className="flex flex-col items-center origin-top transition-transform duration-300 ease-out"
                        style={{ transform: `scale(${scale})` }}
                    >
                        <div ref={gridWrapperRef} className="flex flex-col items-center">
                            {decades}
                        </div>
                    </div>
                </div>
            );
        };

        const Settings = ({ userData, onSave, onClose }) => {
            const [formData, setFormData] = useState({ ...userData });
            const colorInputRefs = useRef({});

            const handleAddSection = () => {
                const newSection = {
                    id: Math.random().toString(36).substr(2, 9),
                    label: 'New Chapter',
                    color: PRESET_COLORS[formData.sections.length % PRESET_COLORS.length],
                    startDate: formData.dob,
                    endDate: 'current',
                };
                setFormData({ ...formData, sections: [...formData.sections, newSection] });
            };

            const updateSection = (id, updates) => {
                setFormData({
                    ...formData,
                    sections: formData.sections.map(s => s.id === id ? { ...s, ...updates } : s)
                });
            };

            const removeSection = (id) => {
                setFormData({ ...formData, sections: formData.sections.filter(s => s.id !== id) });
            };

            return (
                <div className="fixed inset-0 bg-slate-950 z-50 overflow-y-auto flex flex-col p-6 fade-in">
                    <div className="flex justify-between items-center mb-10 mt-2">
                        <div>
                            <h1 className="text-3xl font-black tracking-tight text-white uppercase italic">Profile</h1>
                            <p className="text-xs font-bold text-slate-500 uppercase tracking-widest">Settings & History</p>
                        </div>
                        <button onClick={onClose} className="p-3.5 rounded-full bg-slate-900 border border-white/10 text-slate-100 active:scale-90 transition-transform shadow-lg">
                            <svg className="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M6 18L18 6M6 6l12 12" /></svg>
                        </button>
                    </div>

                    <div className="space-y-12 max-w-lg mx-auto w-full pb-36">
                        <section className="bg-slate-900/60 p-7 rounded-3xl space-y-7 border border-white/5">
                            <h2 className="text-sm font-black uppercase tracking-[0.2em] text-blue-500">The Basics</h2>
                            <div className="space-y-5">
                                <div className="space-y-2">
                                    <label className="block text-xs font-bold uppercase text-slate-400 tracking-wider">Date of Birth</label>
                                    <input 
                                        type="date" 
                                        value={formData.dob} 
                                        onChange={(e) => setFormData({ ...formData, dob: e.target.value })} 
                                        className="w-full bg-slate-950 border border-white/10 rounded-2xl p-5 text-white text-lg outline-none focus:ring-2 focus:ring-blue-500/50 transition-all" 
                                    />
                                </div>
                                <div className="space-y-2">
                                    <label className="block text-xs font-bold uppercase text-slate-400 tracking-wider">Lifespan Goal (Years)</label>
                                    <input 
                                        type="number" 
                                        value={formData.lifespanYears} 
                                        onChange={(e) => setFormData({ ...formData, lifespanYears: parseInt(e.target.value) || 90 })} 
                                        className="w-full bg-slate-950 border border-white/10 rounded-2xl p-5 text-white text-lg outline-none focus:ring-2 focus:ring-blue-500/50 transition-all" 
                                    />
                                </div>
                            </div>
                        </section>

                        <section className="space-y-8">
                            <div className="flex justify-between items-center px-2">
                                <h2 className="text-sm font-black uppercase tracking-[0.2em] text-blue-500">Life Chapters</h2>
                                <button 
                                    onClick={handleAddSection} 
                                    className="text-xs bg-white text-black px-5 py-3 rounded-full font-black uppercase tracking-widest active:scale-95 transition-transform shadow-xl"
                                >
                                    + Add New
                                </button>
                            </div>
                            
                            <div className="space-y-6">
                                {formData.sections.map((section) => {
                                    const isCustomColor = !PRESET_COLORS.includes(section.color);
                                    return (
                                        <div key={section.id} className="bg-slate-900/60 p-6 rounded-3xl space-y-6 border border-white/5 border-l-8" style={{ borderLeftColor: section.color }}>
                                            <div className="flex justify-between items-start gap-4">
                                                <input 
                                                    type="text" 
                                                    value={section.label} 
                                                    onChange={(e) => updateSection(section.id, { label: e.target.value })} 
                                                    className="flex-1 bg-transparent text-2xl font-black text-white outline-none placeholder-slate-800"
                                                    placeholder="Chapter Title..."
                                                />
                                                <button onClick={() => removeSection(section.id)} className="text-slate-600 hover:text-red-500 p-2 active:scale-90 transition-transform">
                                                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                                                </button>
                                            </div>
                                            
                                            <div className="grid grid-cols-2 gap-5">
                                                <div className="space-y-2">
                                                    <label className="text-slate-500 block text-[10px] uppercase font-black tracking-[0.2em]">Started</label>
                                                    <input 
                                                        type="date" 
                                                        value={section.startDate} 
                                                        onChange={(e) => updateSection(section.id, { startDate: e.target.value })} 
                                                        className="w-full bg-slate-950 border border-white/5 p-4 rounded-2xl text-sm text-white outline-none" 
                                                    />
                                                </div>
                                                <div className="space-y-2">
                                                    <label className="text-slate-500 block text-[10px] uppercase font-black tracking-[0.2em]">Ended</label>
                                                    <div className="relative">
                                                        <input 
                                                            type="date" 
                                                            value={section.endDate === 'current' ? '' : section.endDate} 
                                                            onChange={(e) => updateSection(section.id, { endDate: e.target.value || 'current' })} 
                                                            className="w-full bg-slate-950 border border-white/5 p-4 rounded-2xl text-sm text-white outline-none" 
                                                            placeholder="Until Today"
                                                        />
                                                        {section.endDate === 'current' && (
                                                            <div className="absolute inset-0 bg-slate-950 rounded-2xl flex items-center px-4 pointer-events-none">
                                                                <span className="text-blue-500 font-black text-xs uppercase tracking-[0.2em]">Ongoing</span>
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="flex flex-wrap gap-3 pt-2 items-center">
                                                {PRESET_COLORS.map(c => (
                                                    <button 
                                                        key={c} 
                                                        onClick={() => updateSection(section.id, { color: c })} 
                                                        className={`w-8 h-8 rounded-full transition-all ${section.color === c ? 'ring-2 ring-white ring-offset-4 ring-offset-slate-950 scale-125 z-10' : 'opacity-50 hover:opacity-100 hover:scale-110'}`} 
                                                        style={{ backgroundColor: c }} 
                                                    />
                                                ))}
                                                <div className="relative flex items-center">
                                                    <input 
                                                        type="color" 
                                                        ref={el => colorInputRefs.current[section.id] = el} 
                                                        className="invisible absolute w-0 h-0" 
                                                        onChange={(e) => updateSection(section.id, { color: e.target.value })} 
                                                    />
                                                    <button 
                                                        onClick={() => colorInputRefs.current[section.id].click()} 
                                                        className={`w-8 h-8 rounded-full color-wheel relative overflow-hidden transition-all ${isCustomColor ? 'ring-2 ring-white ring-offset-4 ring-offset-slate-950 scale-125 z-10' : 'opacity-50 hover:opacity-100 hover:scale-110'}`}
                                                    >
                                                        {isCustomColor && <div className="absolute inset-1 rounded-full border border-white/50" style={{ backgroundColor: section.color }} />}
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </section>
                    </div>

                    <div className="fixed bottom-0 left-0 right-0 p-8 bg-gradient-to-t from-slate-950 via-slate-950 to-transparent">
                        <button 
                            onClick={() => onSave(formData)} 
                            className="w-full bg-blue-600 hover:bg-blue-500 text-white py-6 rounded-3xl font-black uppercase tracking-[0.3em] shadow-2xl shadow-blue-900/40 active:scale-95 transition-all text-sm"
                        >
                            Save Chapters
                        </button>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('grid');
            const [data, setData] = useState(() => {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    try {
                        return JSON.parse(saved);
                    } catch (e) {
                        console.error("Failed to load data", e);
                    }
                }
                const d = new Date(); d.setFullYear(d.getFullYear() - 25);
                return { 
                    dob: d.toISOString().split('T')[0], 
                    lifespanYears: DEFAULT_LIFESPAN, 
                    sections: [] 
                };
            });

            useEffect(() => {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            }, [data]);

            const handleSave = (newData) => {
                setData(newData);
                setView('grid');
            };

            return (
                <div className="min-h-screen flex flex-col bg-slate-950 text-slate-50 relative overflow-x-hidden">
                    <header className="sticky top-0 z-40 bg-slate-950/95 backdrop-blur-2xl border-b border-white/5 px-8 py-6 flex justify-between items-center shadow-xl">
                        <div className="flex flex-col">
                            <h1 className="text-2xl font-black tracking-tight uppercase italic text-white leading-none">Memento Mori</h1>
                            <p className="text-[10px] text-slate-500 font-black tracking-[0.5em] uppercase mt-2">Life in Weeks</p>
                        </div>
                        <button 
                            onClick={() => setView('settings')} 
                            className="p-3.5 rounded-2xl bg-slate-900/80 border border-white/10 active:scale-90 transition-all hover:bg-slate-800 shadow-inner"
                        >
                            <svg className="w-6 h-6 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M4 6h16M4 12h16m-7 6h7" />
                            </svg>
                        </button>
                    </header>
                    
                    <main className="flex-1 overflow-y-auto">
                        <LifeGrid userData={data} />
                    </main>
                    
                    {view === 'settings' && (
                        <Settings 
                            userData={data} 
                            onSave={handleSave} 
                            onClose={() => setView('grid')} 
                        />
                    )}

                    <footer className="py-12 flex flex-col items-center gap-2 opacity-30 select-none">
                        <span className="text-xs font-black uppercase tracking-[0.4em]">Enjoy the journey</span>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
