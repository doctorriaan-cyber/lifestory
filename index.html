<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Memento Mori - Life Calendar</title>
    <!-- Tailwind for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React and Babel for single-file JSX execution -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            background-color: #020617;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        
        /* Animation for transitions */
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        /* Custom color wheel style */
        .color-wheel {
            background: conic-gradient(red, yellow, green, cyan, blue, magenta, red);
        }

        /* Prevent zooming on inputs in iOS/Android */
        input[type="date"], input[type="text"], input[type="number"] {
            font-size: 16px !important;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;

        // --- CONSTANTS ---
        const DEFAULT_LIFESPAN = 90;
        const WEEKS_IN_YEAR = 52;
        const MONTH_WEEKS = [4, 4, 4, 5, 4, 4, 5, 4, 4, 5, 4, 5];
        const STORAGE_KEY = 'memento_mori_v3_storage';
        const PRESET_COLORS = [
            '#ef4444', '#f97316', '#f59e0b', '#eab308', '#84cc16', 
            '#22c55e', '#10b981', '#06b6d4', '#0ea5e9', '#3b82f6', 
            '#6366f1', '#8b5cf6', '#a855f7', '#d946ef', '#ec4899', '#f43f5e'
        ];

        // --- HELPERS ---
        const getDateForWeek = (dob, year, week) => {
            const date = new Date(dob);
            date.setDate(date.getDate() + (year * WEEKS_IN_YEAR + week) * 7);
            return date;
        };

        // --- COMPONENTS ---

        const LifeGrid = ({ userData }) => {
            const { dob, lifespanYears, sections } = userData;
            const birthDate = useMemo(() => new Date(dob), [dob]);
            const now = useMemo(() => new Date(), []);
            const containerRef = useRef(null);
            const [scale, setScale] = useState(1);

            const sectionDates = useMemo(() => {
                return (sections || []).map(s => ({
                    ...s,
                    start: new Date(s.startDate),
                    end: s.endDate === 'current' ? now : new Date(s.endDate)
                })).sort((a, b) => a.start.getTime() - b.start.getTime());
            }, [sections, now]);

            useEffect(() => {
                const handleResize = () => {
                    if (containerRef.current) {
                        const parentWidth = window.innerWidth - 32;
                        const gridWidth = 320; 
                        setScale(parentWidth < gridWidth ? parentWidth / gridWidth : 1);
                    }
                };
                handleResize();
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            const renderDecade = (startYear) => {
                const yearRows = [];
                const endYear = Math.min(startYear + 10, lifespanYears);

                for (let year = startYear; year < endYear; year++) {
                    const monthGroups = [];
                    let currentWeekInYear = 0;

                    MONTH_WEEKS.forEach((numWeeks, monthIdx) => {
                        const dots = [];
                        for (let w = 0; w < numWeeks; w++) {
                            const weekDate = getDateForWeek(birthDate, year, currentWeekInYear);
                            let isLived = weekDate <= now;
                            let color = isLived ? '#FFFFFF' : 'transparent';
                            let opacity = isLived ? '1' : '0.2';
                            
                            if (isLived) {
                                const activeSection = sectionDates.find(s => weekDate >= s.start && weekDate < s.end);
                                if (activeSection) color = activeSection.color;
                            }

                            dots.push(
                                <div key={w} className="w-1.5 h-1.5 rounded-full shrink-0"
                                     style={{ 
                                         backgroundColor: color, 
                                         opacity, 
                                         border: !isLived ? '1px solid rgba(255,255,255,0.2)' : 'none' 
                                     }} 
                                />
                            );
                            currentWeekInYear++;
                        }
                        monthGroups.push(<div key={monthIdx} className="flex gap-[2px]">{dots}</div>);
                    });

                    yearRows.push(
                        <div key={year} className="flex items-center gap-[6px] h-[8px]">
                            <div className="w-6 text-[8px] text-slate-600 font-mono text-right shrink-0">
                                {year % 5 === 0 ? year : ''}
                            </div>
                            <div className="flex gap-[6px]">{monthGroups}</div>
                        </div>
                    );
                }

                return (
                    <div key={startYear} className="flex flex-col gap-[2px] mb-3 p-2 border border-slate-900/50 rounded-md bg-slate-900/10">
                        {yearRows}
                    </div>
                );
            };

            const decades = [];
            for (let y = 0; y < lifespanYears; y += 10) decades.push(renderDecade(y));

            return (
                <div className="flex flex-col items-center py-6 w-full select-none">
                    <div className="mb-10 w-full max-w-sm px-6 flex flex-col items-center text-center">
                        <h3 className="text-[11px] font-black uppercase tracking-[0.3em] text-slate-500 mb-2">Life Chapters</h3>
                        <p className="text-[10px] font-mono tracking-widest uppercase text-slate-600 mb-6 opacity-70">Each dot is one week</p>
                        
                        <div className="flex flex-wrap justify-center gap-x-4 gap-y-3 w-full">
                            {(sections || []).map(s => (
                                <div key={s.id} className="flex items-center gap-2 text-[10px]">
                                    <div className="w-2.5 h-2.5 rounded-full shrink-0 shadow-sm" style={{ backgroundColor: s.color }} />
                                    <span className="text-slate-400 font-medium truncate">{s.label}</span>
                                </div>
                            ))}
                            <div className="flex items-center gap-2 text-[10px]">
                                <div className="w-2.5 h-2.5 rounded-full bg-white shadow-sm" />
                                <span className="text-slate-400 font-medium">Lived</span>
                            </div>
                            <div className="flex items-center gap-2 text-[10px]">
                                <div className="w-2.5 h-2.5 rounded-full border border-slate-700" />
                                <span className="text-slate-400 font-medium">Future</span>
                            </div>
                        </div>
                    </div>
                    
                    <div ref={containerRef} style={{ transform: `scale(${scale})`, transformOrigin: 'top center', width: 'fit-content' }}>
                        {decades}
                    </div>
                </div>
            );
        };

        const Settings = ({ userData, onSave, onClose }) => {
            const [formData, setFormData] = useState({ ...userData });
            const colorInputRefs = useRef({});

            const handleAddSection = () => {
                const newSection = {
                    id: Math.random().toString(36).substr(2, 9),
                    label: 'New Chapter',
                    color: PRESET_COLORS[formData.sections.length % PRESET_COLORS.length],
                    startDate: formData.dob,
                    endDate: 'current',
                };
                setFormData({ ...formData, sections: [...formData.sections, newSection] });
            };

            const updateSection = (id, updates) => {
                setFormData({
                    ...formData,
                    sections: formData.sections.map(s => s.id === id ? { ...s, ...updates } : s)
                });
            };

            const removeSection = (id) => {
                setFormData({ ...formData, sections: formData.sections.filter(s => s.id !== id) });
            };

            return (
                <div className="fixed inset-0 bg-slate-950 z-50 overflow-y-auto flex flex-col p-6 fade-in">
                    <div className="flex justify-between items-center mb-10 mt-2">
                        <div>
                            <h1 className="text-3xl font-black tracking-tight text-white uppercase italic">Profile</h1>
                            <p className="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Settings & History</p>
                        </div>
                        <button onClick={onClose} className="p-3 rounded-full bg-slate-900 border border-white/10 text-slate-100 active:scale-90 transition-transform">
                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
                        </button>
                    </div>

                    <div className="space-y-10 max-w-lg mx-auto w-full pb-32">
                        {/* THE BASICS */}
                        <section className="bg-slate-900/40 p-6 rounded-2xl space-y-6 border border-white/5">
                            <h2 className="text-xs font-black uppercase tracking-[0.2em] text-blue-500">The Basics</h2>
                            <div className="space-y-4">
                                <div className="space-y-1.5">
                                    <label className="block text-[10px] font-bold uppercase text-slate-500 tracking-wider">Date of Birth</label>
                                    <input 
                                        type="date" 
                                        value={formData.dob} 
                                        onChange={(e) => setFormData({ ...formData, dob: e.target.value })} 
                                        className="w-full bg-slate-900 border border-white/10 rounded-xl p-4 text-white outline-none focus:ring-2 focus:ring-blue-500/50 transition-all" 
                                    />
                                </div>
                                <div className="space-y-1.5">
                                    <label className="block text-[10px] font-bold uppercase text-slate-500 tracking-wider">Lifespan Goal (Years)</label>
                                    <input 
                                        type="number" 
                                        value={formData.lifespanYears} 
                                        onChange={(e) => setFormData({ ...formData, lifespanYears: parseInt(e.target.value) || 90 })} 
                                        className="w-full bg-slate-900 border border-white/10 rounded-xl p-4 text-white outline-none focus:ring-2 focus:ring-blue-500/50 transition-all" 
                                    />
                                </div>
                            </div>
                        </section>

                        {/* CHAPTERS */}
                        <section className="space-y-6">
                            <div className="flex justify-between items-center px-2">
                                <h2 className="text-xs font-black uppercase tracking-[0.2em] text-blue-500">Life Chapters</h2>
                                <button 
                                    onClick={handleAddSection} 
                                    className="text-[10px] bg-white text-black px-4 py-2 rounded-full font-black uppercase tracking-wider active:scale-95 transition-transform"
                                >
                                    + Add Chapter
                                </button>
                            </div>
                            
                            <div className="space-y-4">
                                {formData.sections.map((section) => {
                                    const isCustomColor = !PRESET_COLORS.includes(section.color);
                                    return (
                                        <div key={section.id} className="bg-slate-900/40 p-5 rounded-2xl space-y-5 border border-white/5 border-l-4" style={{ borderLeftColor: section.color }}>
                                            <div className="flex justify-between items-start gap-3">
                                                <input 
                                                    type="text" 
                                                    value={section.label} 
                                                    onChange={(e) => updateSection(section.id, { label: e.target.value })} 
                                                    className="flex-1 bg-transparent text-xl font-bold text-white outline-none placeholder-slate-700"
                                                    placeholder="Chapter Title..."
                                                />
                                                <button onClick={() => removeSection(section.id)} className="text-slate-600 hover:text-red-400 p-1 active:scale-90 transition-transform">
                                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                                                </button>
                                            </div>
                                            
                                            <div className="grid grid-cols-2 gap-4">
                                                <div className="space-y-1.5">
                                                    <label className="text-slate-600 block text-[9px] uppercase font-black tracking-widest">Start Date</label>
                                                    <input 
                                                        type="date" 
                                                        value={section.startDate} 
                                                        onChange={(e) => updateSection(section.id, { startDate: e.target.value })} 
                                                        className="w-full bg-slate-950 border border-white/5 p-3 rounded-xl text-xs text-white outline-none" 
                                                    />
                                                </div>
                                                <div className="space-y-1.5">
                                                    <label className="text-slate-600 block text-[9px] uppercase font-black tracking-widest">End Date</label>
                                                    <div className="relative">
                                                        <input 
                                                            type="date" 
                                                            value={section.endDate === 'current' ? '' : section.endDate} 
                                                            onChange={(e) => updateSection(section.id, { endDate: e.target.value || 'current' })} 
                                                            className="w-full bg-slate-950 border border-white/5 p-3 rounded-xl text-xs text-white outline-none" 
                                                            placeholder="Until Today"
                                                        />
                                                        {section.endDate === 'current' && (
                                                            <div className="absolute inset-0 bg-slate-950 rounded-xl flex items-center px-3 pointer-events-none">
                                                                <span className="text-blue-500 font-bold text-xs uppercase tracking-wider">Ongoing</span>
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                            </div>

                                            <div className="flex flex-wrap gap-2.5 pt-2 items-center">
                                                {PRESET_COLORS.map(c => (
                                                    <button 
                                                        key={c} 
                                                        onClick={() => updateSection(section.id, { color: c })} 
                                                        className={`w-7 h-7 rounded-full transition-all ${section.color === c ? 'ring-2 ring-white ring-offset-4 ring-offset-slate-950 scale-110 z-10' : 'opacity-60 hover:opacity-100 hover:scale-110'}`} 
                                                        style={{ backgroundColor: c }} 
                                                    />
                                                ))}
                                                <div className="relative flex items-center">
                                                    <input 
                                                        type="color" 
                                                        ref={el => colorInputRefs.current[section.id] = el} 
                                                        className="invisible absolute w-0 h-0" 
                                                        onChange={(e) => updateSection(section.id, { color: e.target.value })} 
                                                    />
                                                    <button 
                                                        onClick={() => colorInputRefs.current[section.id].click()} 
                                                        className={`w-7 h-7 rounded-full color-wheel relative overflow-hidden transition-all ${isCustomColor ? 'ring-2 ring-white ring-offset-4 ring-offset-slate-950 scale-110 z-10' : 'opacity-60 hover:opacity-100 hover:scale-110'}`}
                                                    >
                                                        {isCustomColor && <div className="absolute inset-0.5 rounded-full border border-white/50" style={{ backgroundColor: section.color }} />}
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                                {formData.sections.length === 0 && (
                                    <div className="text-center py-12 px-6 border-2 border-dashed border-white/5 rounded-3xl">
                                        <p className="text-slate-600 text-xs font-bold uppercase tracking-widest">No chapters added yet</p>
                                    </div>
                                )}
                            </div>
                        </section>
                    </div>

                    <div className="fixed bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-slate-950 via-slate-950 to-transparent">
                        <button 
                            onClick={() => onSave(formData)} 
                            className="w-full bg-blue-600 hover:bg-blue-500 text-white py-5 rounded-2xl font-black uppercase tracking-[0.2em] shadow-2xl shadow-blue-900/40 active:scale-95 transition-all"
                        >
                            Save Changes
                        </button>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('grid');
            const [data, setData] = useState(() => {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    try {
                        return JSON.parse(saved);
                    } catch (e) {
                        console.error("Failed to load data", e);
                    }
                }
                // Default setup for a fresh start
                const d = new Date(); d.setFullYear(d.getFullYear() - 25);
                return { 
                    dob: d.toISOString().split('T')[0], 
                    lifespanYears: DEFAULT_LIFESPAN, 
                    sections: [] 
                };
            });

            // Save to LocalStorage whenever data changes
            useEffect(() => {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            }, [data]);

            const handleSave = (newData) => {
                setData(newData);
                setView('grid');
            };

            return (
                <div className="min-h-screen flex flex-col bg-slate-950 text-slate-50 relative overflow-x-hidden">
                    <header className="sticky top-0 z-40 bg-slate-950/90 backdrop-blur-xl border-b border-white/5 px-6 py-5 flex justify-between items-center">
                        <div className="flex flex-col">
                            <h1 className="text-xl font-black tracking-tight uppercase italic text-white leading-none">Memento Mori</h1>
                            <p className="text-[9px] text-slate-600 font-bold tracking-[0.4em] uppercase mt-1">Life in Weeks</p>
                        </div>
                        <button 
                            onClick={() => setView('settings')} 
                            className="p-3 rounded-full bg-slate-900/50 border border-white/10 active:scale-90 transition-all hover:bg-slate-800"
                        >
                            <svg className="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16m-7 6h7" />
                            </svg>
                        </button>
                    </header>
                    
                    <main className="flex-1 overflow-y-auto">
                        <LifeGrid userData={data} />
                    </main>
                    
                    {view === 'settings' && (
                        <Settings 
                            userData={data} 
                            onSave={handleSave} 
                            onClose={() => setView('grid')} 
                        />
                    )}

                    {/* Subtle footer */}
                    <footer className="py-8 flex justify-center opacity-20 select-none">
                        <span className="text-[10px] font-black uppercase tracking-[0.3em]">Enjoy the journey</span>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
